pluginManagement {
    repositories {
        google()
        gradlePluginPortal()
        mavenCentral()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    }

    resolutionStrategy {
        eachPlugin {
            when (requested.id.id) {
                "com.android.application",
                "com.android.library",
                "com.android.test" -> useVersion("8.2.2")

                "com.google.dagger.hilt.android" -> useVersion("2.50")

                "androidx.navigation.safeargs.kotlin" -> useVersion("2.7.6")
            }

            if (requested.id.id.startsWith("org.jetbrains.kotlin")) {
                useVersion("1.9.22")
            }
        }
    }
}

include ":app"
include ":modules:i18n"
